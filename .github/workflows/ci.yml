name: CI
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Lint Shoedoc annotations with shoemaker
      run: python3 shoemaker.py lint src

    - name: Check for code quality errors
      run: ./entrypoint.sh lint

  ubuntu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: install Ubuntu dependencies with sudo apt install -y
      run: sudo apt install -y gawk

    - name: Unit testing with bash_unit
      run: ./entrypoint.sh tests

  macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7

    - name: install MacOS dependencies with brew install
      run: brew install gawk

    - name: Unit testing with bash_unit
      run: ./entrypoint.sh tests
